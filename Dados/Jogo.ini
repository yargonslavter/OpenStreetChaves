; Dados/Jogo.ini - valores do jogo que antes ficavam fixos no codigo.
; Linhas que comecam com ; sao comentarios. Decimais usam ponto (0.9).
; Se uma chave faltar, o jogo usa o valor do jogo original.

[Jogo]
Versao=V1.5A
; intervalo entre quadros, em milissegundos (as teclas - e = mudam durante o jogo)
IntervaloTimer=28
; aceleracao vertical somada a cada quadro durante um pulo
Gravidade=4
; multiplicador de quanto cada golpe enche a barra do especial
GanhoCarga=2.0
; chance de o voador (cenarios 1 e 2) aparecer: 1 em N a cada quadro
AlcanceVoador=330

[Padroes]
; configuracao inicial (tela F1) quando ainda nao existe Chaves.ini
; NivelJogo 1..8, TempoRound 1..4 (30, 60, 90, infinito), ModoPoder 1..4,
; NivelDano 0.3..2.0, NumRounds 1..3, Idioma 1 = portugues / 2 = espanhol
