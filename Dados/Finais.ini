; Dados/Finais.ini - o final de cada personagem: uma cena com tempo (T = quadros desde o inicio).
; Legenda = primeira linha das legendas na secao [Finais] dos textos (trechos de 4 linhas a cada 200 quadros).
; Cada linha N=condicao: comando, executadas em ordem a cada quadro.
;   condicao: * (sempre) ou termos ligados por & (todos) e | (qualquer grupo):
;     T=0, T<400, T>=1600, T>350&T<400; Rn = sorteio de 1 em n (Random(n) = 0)
;   comandos:
;     cenario N                       carrega o cenario N
;     lutador Personagem,Jogador      carrega o personagem no lugar do jogador 1 ou 2
;     desenha Jogador,X,Y,Acao,Quadro desenha o lutador (pes em X,Y) na acao e quadro de acao dados
;     fala x1,y1,x2,y2,Imagem,X,Y     sombra na caixa x1..y2 e a imagem do final (lista [Final] do Recursos.ini)
;     imagem Imagem,X,Y               so a imagem do final
;     preto                           tela preta (troca de cena)
;     explosao                        tela de cor sorteada com fagulhas
;     efeito Tipo,X,Y                 cria um efeito (X e Y podem ter sorteio: 150+R100 = 150 + 0..99)

