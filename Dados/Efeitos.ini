; Dados/Efeitos.ini - tipos de efeito da luta (fagulhas, sangue, poeira, projeteis, textos...).
; Cada [EfeitoN] tem, na ordem em que sao aplicados:
;   - ao criar o efeito: Campo=valor. Valores: numero; 1/0 para liga/desliga; "dono" (Lado igual ao
;     do lutador que criou); A+Rn ou A+K*Rn / A-K*Rn (A mais K vezes um sorteio de 0..n-1);
;     "1 em N" (liga em 1 de cada N vezes). Campo.A / Campo.B = so quando o efeito e criado com
;     o texto A ou B (golpe fraco / forte). Caixa=x1,y1,x2,y2 (caixa de colisao relativa).
;     Campo#2 = o mesmo campo outra vez (a ordem importa por causa dos sorteios).
;   - a cada quadro (AnimN): condicao:acao, todas as que valerem, na ordem.
;     condicao: * (sempre) ou termos ligados por & : Q = quadro do efeito, C = Contagem,
;       D = Duracao, L = LimiteContagem (ex.: Q=2, Q<12, Q>=D-20, C>=L-10)
;     acao: Sn (sprite n de Efeitos), Q0 (volta ao quadro 0), E1 (liga o Estagio),
;       SOBE (sobe 1 pixel, menos durante pausa de impacto/flash)
; Campos que o efeito nao define continuam como estavam (como no jogo original).

