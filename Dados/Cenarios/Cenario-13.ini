; Caixa: x1,y1,x2,y2 relativos a X,Y; Resistencia: golpes que aguenta (cair em cima quebra de vez);
; Pedacos: tipo de efeito (Dados/Efeitos.ini) e QtdPedacos; Pontos para quem quebra; Som ao quebrar;
