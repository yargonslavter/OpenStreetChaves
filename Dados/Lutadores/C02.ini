; Dados/Lutadores/C02.ini - dados do personagem 2 (SEU MADRUGA).
; [Geral]: atributos; [Golpes]: lista da tecla G; [CentroX], [Corpo] e [Ataque]: centro do sprite e
; caixas de colisao de cada quadro (extraidos do codigo original; agora o jogo le daqui).
; Quadros contados a partir de 1 (jogador 1); o jogo soma 50 para o jogador 2.

[Geral]
; altura do sprite (o jogo desenha o lutador com os pes na posicao Y) e velocidade de caminhada
AlturaSprite=162
Velocidade=8.0
; campanha: ultimo adversario (chefe) e personagens que nunca aparecem como adversarios
Chefe=5
NaoEnfrenta=3,8,9,14,15
; cenario quando este personagem e o adversario: principal, alternativo (2 em 5 vezes, 0 = nenhum)
; e raro (2 em 6 vezes, 0 = nenhum); alternativo e raro nao valem na luta contra o chefe
Cenario=2
CenarioAlternativo=7
CenarioRaro=0
; musica da luta quando este personagem e controlado pelo computador (0 = sorteada)
MusicaCPU=3

[Golpes]
; lista de golpes (tecla G): nome,sequencia; * no comeco do nome = golpe especial final
; sequencia: C cima, B baixo, D direita, E esquerda, Y e Z diagonais,
;   P soco, K chute, ? soco ou chute, R repetido rapido
1=Ryuu Geki Ken,BDP
2=RyuuGa,DBDP
3=Genei Kyaku,DEDK
4=Hien Ryuu Jin Kyaku,CBEK
5=*Ryuko Ranbu,BDBEP

[Sequencias]
; teclas dos golpes especiais: cada regra avanca o passo da sequencia (De>Para) quando as setas
; batem. Lidas em ordem, a cada quadro; o passo volta a 0 se ficar 9 quadros sem avancar.
;   Baixo, Frente, Tras, Cima = segurando a seta (Frente = para o lado do oponente); !Baixo = nao segurando
;   TempoBaixo>=N, TempoTras>=N = segurou baixo/tras por N quadros (conta ate 18 e desce devagar)
;   NoChao = com os pes no chao
1=Baixo, !Frente, !Tras: 0>1
2=Baixo, !Frente, !Tras: 1>1
3=Frente, !Baixo: 1>2
