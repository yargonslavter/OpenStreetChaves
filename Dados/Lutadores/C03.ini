; caixas de colisao de cada quadro (extraidos do codigo original; agora o jogo le daqui).
; Quadros contados a partir de 1 (jogador 1); o jogo soma 50 para o jogador 2.

[Geral]
; altura do sprite (o jogo desenha o lutador com os pes na posicao Y) e velocidade de caminhada
