; Dados/Recursos.ini - imagens e sons que o jogo carrega.
; Caminhos relativos a pasta do jogo. Linhas que comecam com ; sao comentarios.
;
; Listas com nome ([Icones], [Abertura], [Final]): Nome=arquivo,transparente
;   - a ordem das linhas define o numero da imagem; o codigo usa o nome;
;   - transparente: 1 = o branco vira transparente, 0 = imagem opaca.
;
; Series numeradas: Arquivo=padrao, com # no lugar do numero (## = 01, 02 ... 10, 11).

[Icones]
Cima=Embutidos/Icone-Cima.bmp,1
Baixo=Embutidos/Icone-Baixo.bmp,1
Direita=Embutidos/Icone-Direita.bmp,1
Esquerda=Embutidos/Icone-Esquerda.bmp,1
Diagonal1=Embutidos/Icone-Diagonal1.bmp,1
Diagonal2=Embutidos/Icone-Diagonal2.bmp,1
Mesa=Embutidos/Icone-Mesa.bmp,1
Especial=Embutidos/Icone-Especial.bmp,1
Select=Embutidos/Icone-Select.bmp,1
RostoSecreto=Embutidos/Icone-RostoSecreto.bmp,1
X=Embutidos/Icone-X.bmp,1
LogoFundo-PT=Embutidos/Icone-LogoFundo-PT.bmp,1
LogoFundo-ES=Embutidos/Icone-LogoFundo-ES.bmp,1
TesteDeForca=Embutidos/Icone-TesteDeForca.bmp,1

[Abertura]
Predio-01-a=Embutidos/Abertura-Predio-01-a.bmp,0
Predio-01-b=Embutidos/Abertura-Predio-01-b.bmp,0
Predio-02-a=Embutidos/Abertura-Predio-02-a.bmp,1
Predio-02-b=Embutidos/Abertura-Predio-02-b.bmp,1
Folhagem=Embutidos/Abertura-Folhagem.bmp,1
Pessoa-01=Embutidos/Abertura-Pessoa-01.bmp,1
Pessoa-02=Embutidos/Abertura-Pessoa-02.bmp,1
Pessoa-03=Embutidos/Abertura-Pessoa-03.bmp,1
Chaves=Embutidos/Abertura-Chaves.bmp,1
SeuMadruga=Embutidos/Abertura-SeuMadruga.bmp,1
ChavesSoco=Embutidos/Abertura-ChavesSoco.bmp,1
SeuMadrugaCaindo=Embutidos/Abertura-SeuMadrugaCaindo.bmp,1
Logo-PT=Embutidos/Abertura-Logo-PT.bmp,1
Logo-ES=Embutidos/Abertura-Logo-ES.bmp,1
Vencedores=Embutidos/Abertura-Vencedores.bmp,1
Cybergamba=Embutidos/Abertura-Cybergamba.bmp,1

[Final]
Violao=Embutidos/Final-Violao.bmp,1
Madruga-Violao=Embutidos/Final-Madruga-Violao.bmp,1
Quico-Urso=Embutidos/Final-Quico-Urso.bmp,1
Chaves-Urso=Embutidos/Final-Chaves-Urso.bmp,1
Paty-Urso=Embutidos/Final-Paty-Urso.bmp,1
Chaves-Bola=Embutidos/Final-Chaves-Bola.bmp,1
Madruga-Machucado=Embutidos/Final-Madruga-Machucado.bmp,1
Girafales-Flores=Embutidos/Final-Girafales-Flores.bmp,1
Madruga-VelhoDoSaco=Embutidos/Final-Madruga-VelhoDoSaco.bmp,1
Chaves-Gordo=Embutidos/Final-Chaves-Gordo.bmp,1
PratoVazio=Embutidos/Final-PratoVazio.bmp,1

[Finais]
; roteiro do final de cada personagem
Dados=Dados/Finais.ini

[Animacoes]
; animacoes dos cenarios (bandeiras, torcida, fogueira...)
Arquivo=Animacoes/Anim-##.bmp
Quantidade=97

[Efeitos]
; fagulhas, sangue, projeteis... (cada um tambem e carregado espelhado)
Arquivo=Efeitos/Efeito-###.bmp
Quantidade=111

; tipos de efeito: duracao, dano, caixa e animacao de cada um
Dados=Dados/Efeitos.ini

[Efeitos.Nomes]
; nomes de efeitos usados diretamente pelo codigo: Nome=numero do arquivo
Sombra=1
Voador=10

[Rostos]
; cada personagem ocupa uma posicao para cada variante, nesta ordem; * = espelhado
; (um rosto para cada lutador; Quantidade=N muda isso)
Variantes=Rostos/R##-a.bmp,Rostos/R##-a.bmp*,Rostos/R##-b.bmp,Rostos/R##-b.bmp*,Rostos/R##-c.bmp

[Falas]
; frases de vitoria: cada personagem ocupa uma posicao para cada variante, nesta ordem
; (uma fala para cada lutador; Quantidade=N muda isso)
Variantes=Falas/Fala-##-a.wav,Falas/Fala-##-b.wav

[Sons]
; efeitos sonoros: carregados em sequencia ate o primeiro numero que faltar
Arquivo=Sons/Som-##.wav

[Musicas]
; musicas das lutas (contadas ate o primeiro numero que faltar) e a musica embutida dos menus
Arquivo=Musicas/Musica-##.wav
Menu=Embutidos/Musica.wav

[Lutadores]
; folha de sprites e dados (altura, velocidade, campanha, golpes...) de cada personagem;
; os lutadores sao contados ate o primeiro Dados=... que faltar (C01.ini, C02.ini ...);
; Quantidade=N fixa o numero. VagasQuadros = posicoes na lista de quadros (2 jogadores)
Arquivo=Lutadores/C##.bmp
Dados=Dados/Lutadores/C##.ini
; roteiros das acoes (AcaoJogador): o comum a todos e o de cada personagem
RoteiroComum=Dados/Lutadores/Comum.rot
Roteiro=Dados/Lutadores/C##.rot
VagasQuadros=150

[Cenarios]
; imagem e dados (animacoes, item, objetos que quebram, voador) de cada cenario; os cenarios sao
; contados ate o primeiro Dados=... que faltar (Quantidade=N fixa o numero)
Arquivo=Cenarios/Cenario-##.bmp
Dados=Dados/Cenarios/Cenario-##.ini
